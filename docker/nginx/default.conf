server {
    listen 80;
    server_name _;

    root /var/www/favorites/public;
    index index.php index.html;

    client_max_body_size 20m;

    # App-Code liegt ausserhalb des Document Roots; zusätzlich sperren
    location ^~ /src/ {
        deny all;
        return 404;
    }

    location ^~ /bin/ {
        deny all;
        return 404;
    }

    location ^~ /sql/ {
        deny all;
        return 404;
    }

    location ^~ /backup/ {
        deny all;
        return 404;
    }

    location = /_init.php {
        deny all;
        return 404;
    }

    location /favicons/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
