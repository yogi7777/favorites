<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorites Sidebar</title>
  <style>
    body, html { margin:0; padding:0; height:100vh; overflow:hidden; background:#1e1e1e; }
    iframe { border:none; width:100%; height:100%; }
  </style>
</head>
<body>
  <iframe id="mainframe" src="https://your-url.ch"></iframe>

  <script>
    // Versuch, den Kontext etwas natürlicher zu machen
    const iframe = document.getElementById('mainframe');
    iframe.addEventListener('load', () => {
      try {
        iframe.contentWindow.postMessage({ type: 'sidebar-loaded' }, '*');
      } catch(e) {}
    });
  </script>
</body>
</html>
